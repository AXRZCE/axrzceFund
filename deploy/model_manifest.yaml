# Deployment manifest — the version-pinning layer (WP2).
#
# configuration.md §3 fixes family/tier by ROLE (the decorrelation design: different model
# families so adversaries/judges aren't one model checking itself). This manifest pins the exact
# model_version per role and each model's training boundary. It carries its own hash
# (manifest_version), stamped per call alongside model_version into the ReplayTuple
# (core/replay.py), so a model swap is auditable in the replay identity. Versions are swappable
# here without touching the architecture.
#
# ROSTER (ADR-2 amendment 2026-06-25, configuration.md §3): value-frontier per family, NO
# Anthropic. WP2 runs Western-only (Google + OpenAI) — research is isolated, no debate, so family
# choice is moot here; the Chinese open-weight family (DeepSeek/GLM, T2_A) is piloted +
# fixture-validated at WP3 where the debate makes it load-bearing.
#
# CUTOFF SEMANTICS (R1 / backtesting-framework.md §6 C1). The gate guards against MEMORIZATION:
# `cutoff` must be a date provably >= the model's training-data cutoff, so fixture_date > cutoff
# guarantees the fixture was not in training. Anthropic publishes a training-data cutoff; Google
# and OpenAI publish only a "knowledge cutoff" — a LOWER bound on training data, unsafe to use
# directly. So for these models `cutoff` = the model's **public availability date** (OpenRouter
# `created`), a provably-conservative UPPER bound (training data necessarily ends before a model
# ships). Stricter than a self-reported cutoff, and uniform across providers. Sourced 2026-06-25:
#   google/gemini-2.5-flash-lite  avail 2025-07-22  (knowledge cutoff ~Jan 2025)
#   google/gemini-3.1-pro-preview avail 2026-02-19
#   openai/gpt-5.4                avail 2026-03-05  (knowledge cutoff Aug 2025)
# Binding cutoff for a fixture = MAX across its models = 2026-03-05 here -> fixtures must be dated
# AFTER 2026-03-05. Our SEP/SFA data is June 2026, clearing it by ~3 months.
#
# PROVIDER PIN (replay completeness). OpenRouter load-balances one slug across backends by default;
# each role pins `provider` so the backend is fixed and the replay identity is complete.
# `allow_fallbacks: false` -> a routing miss FAILS rather than silently serving from a different
# backend. An unpinned role fails to load (fail-closed). All WP2 backends are Western-hosted.
#
# Access: OpenRouter aggregator (OpenAI-compatible); model_version = OpenRouter slug.

manifest_kind: deployment
access: openrouter

# WP2 in-scope research pool (Western value-frontier; no Anthropic). Build order: FUND-TECH first.
roles:
  FUND-TECH:                                # §3.2 Sector Fundamental Analyst (pilot) — built FIRST (deep data now)
    family: google
    tier: T2
    model_version: google/gemini-3.1-pro-preview
    cutoff: 2026-02-19                      # availability date (conservative >= training cutoff)
    provider:
      only: [google-vertex]
      allow_fallbacks: false

  TECH-01:                                  # §3.4 Technical Analyst — gated on a SEP price backfill (done-criteria A1)
    family: google
    tier: T1.5
    model_version: google/gemini-2.5-flash-lite
    cutoff: 2025-07-22                      # availability date (knowledge cutoff ~Jan 2025)
    provider:
      only: [google-vertex]
      allow_fallbacks: false

  SENT-01:                                  # §3.5 Sentiment & News Analyst (defers if no PIT news)
    family: openai
    tier: T2
    model_version: openai/gpt-5.4
    cutoff: 2026-03-05                      # availability date (knowledge cutoff Aug 2025)
    provider:
      only: [openai]
      allow_fallbacks: false

  # ── WP3 CP2 — LIVE debate + decision roles (configuration.md §3; R1 verdict seated the BULL) ───────
  # Decorrelation invariant (Frozen-Set §9.4): family(BULL)=chinese ≠ family(BEAR)=openai;
  # family(PM/MOD)=google sits outside both. Enforced at debate entry via core/heterogeneity.
  # BULL-01 = z-ai/glm-5.2 per the CP1b run-of-record verdict (results/wp3_cp1/run3/, reviewer-verified,
  # Akshar-cleared): mean_composite 0.7383 vs west baseline 0.7188, G1/G2/G3 all passed.
  BULL-01:                                   # §4.1 adversarial bull — T2_A Chinese open-weight (R1-validated)
    family: chinese
    tier: T2
    model_version: z-ai/glm-5.2
    cutoff: 2026-06-16                        # availability date (OpenRouter created=1781631930) — BINDS debate fixtures
    provider:
      only: [together]                       # Western host (R1)
      allow_fallbacks: false

  BEAR-01:                                   # §4.1 adversarial bear — T2_B OpenAI frontier (ADR-2)
    family: openai
    tier: T2
    model_version: openai/gpt-5.4
    cutoff: 2026-03-05                        # availability date (= SENT-01 pin, confirmed at WP2)
    provider:
      only: [openai]
      allow_fallbacks: false

  MOD-01:                                    # §4.2 moderator — T2_C Google (outside both debating families)
    family: google
    tier: T2
    model_version: google/gemini-3.1-pro-preview
    cutoff: 2026-02-19                        # availability date (= FUND-TECH pin)
    provider:
      only: [google-vertex]
      allow_fallbacks: false

  PM-01:                                     # §5.1 portfolio manager — T2_C Google (third family); consumed at CP3
    family: google
    tier: T2
    model_version: google/gemini-3.1-pro-preview
    cutoff: 2026-02-19                        # availability date
    provider:
      only: [google-vertex]
      allow_fallbacks: false

  # ── WP3 CP4 — VERIF-01 T3 judge seats, ONE PER FAMILY (configuration.md §3 T3_judge) ─────────────
  # "strongest available family ≠ judged agents per call": the orchestrator resolves the judge FAMILY
  # at call time (core/heterogeneity + graphs/judge.py), then seats that family's judge role below.
  # Never a hardcoded judge model. All slugs/cutoffs previously confirmed — no new lookups.
  VERIF-01-JUDGE-GOOGLE:                     # judges the debate (judged = chinese BULL + openai BEAR)
    family: google
    tier: T3
    model_version: google/gemini-3.1-pro-preview
    cutoff: 2026-02-19
    provider:
      only: [google-vertex]
      allow_fallbacks: false

  VERIF-01-JUDGE-OPENAI:                     # judges google agents (PM/MOD/FUND-TECH outputs)
    family: openai
    tier: T3
    model_version: openai/gpt-5.4
    cutoff: 2026-03-05
    provider:
      only: [openai]
      allow_fallbacks: false

  VERIF-01-JUDGE-CHINESE:                    # third judge seat (Western-host-pinned per R1)
    family: chinese
    tier: T3
    model_version: z-ai/glm-5.2
    cutoff: 2026-06-16
    provider:
      only: [together]
      allow_fallbacks: false

  # ── WP3 CP1 — BULL-seat comparison roles (VALIDATION-ONLY — not runtime) ─────────────────────────
  # Retained as part of the committed R1 evidence: they are the replay identity of the CP1 comparison
  # (results/wp3_cp1/run3/). `scope: validation` means the RUNTIME loop can never route to them —
  # core/manifest.resolve_runtime() fail-closes on a validation-scoped role (tested).
  # Chinese-origin models are WESTERN-HOST-pinned per R1 (a non-Western host fails to load —
  # core/manifest.py WESTERN_HOSTS, fail-closed).
  #
  # CONFIRMED cutoffs (CP1b-PRE — OpenRouter `created` metadata, spend-free GET, no completion):
  # DeepSeek V4-Pro created=1777000679 -> 2026-04-24; GLM-5.2 created=1781631930 -> 2026-06-16 (BINDS).
  # New binding cutoff (comparison) = 2026-06-16; golden days 2026-06-23..26 clear it (THIN 7-day
  # margin -> the C3 memorization probe is MANDATORY this run, docs/wp3-cp1-rubric.md §5). The R1
  # date-gate (data/fixtures/harness.load_fixture) re-checks decision_ts > binding at load (fail-closed).
  BULL-01-CAND-DEEPSEEK:                     # T2_A candidate — DeepSeek V4-Pro (Chinese open-weight)
    family: chinese
    tier: T2
    scope: validation                        # CP1 evidence only — runtime resolution fail-closes
    model_version: deepseek/deepseek-v4-pro
    cutoff: 2026-04-24                       # CONFIRMED (OpenRouter created=1777000679, 2026-04-24T03:17:59Z)
    provider:
      only: [fireworks]                      # Western host (R1)
      allow_fallbacks: false

  BULL-01-CAND-GLM:                          # T2_A candidate — GLM-5.2 (Zhipu, Chinese open-weight)
    family: chinese
    tier: T2
    scope: validation                        # CP1 evidence only — the LIVE seat is the BULL-01 role above
    model_version: z-ai/glm-5.2
    cutoff: 2026-06-16                        # CONFIRMED (OpenRouter created=1781631930, 2026-06-16T17:45:30Z) — BINDS
    provider:
      only: [together]                       # Western host (R1)
      allow_fallbacks: false

  BULL-01-BASELINE-WEST:                     # Western frontier yardstick used by the CP1 comparison
    family: google
    tier: T2
    scope: validation                        # CP1 evidence only — runtime resolution fail-closes
    model_version: google/gemini-3.1-pro-preview
    cutoff: 2026-02-19                        # availability date (same model as FUND-TECH)
    provider:
      only: [google-vertex]
      allow_fallbacks: false

  VERIF-CP1-JUDGE:                           # T3 scoring judge — OpenAI family, DISJOINT from every judged
    family: openai                           # judged = google baseline + chinese x2; openai is disjoint from both
    tier: T3
    scope: validation                        # CP1 evidence only — runtime resolution fail-closes
    model_version: openai/gpt-5.4
    cutoff: 2026-03-05                        # availability date
    provider:
      only: [openai]
      allow_fallbacks: false
