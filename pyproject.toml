[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axrzce-fund"
version = "0.0.0"
description = "Multi-agent AI hedge fund (US equities, paper trading)"
requires-python = ">=3.11"  # code needs 3.11+ (fromisoformat 'Z', X|Y unions); the
                            # earlier >=3.14 pin was incidental to the laptop and would
                            # block the VM, which likely ships 3.11–3.13.
authors = [{name = "AXRZCE", email = "none@example.com"}]
license = {text = "MIT"}

dependencies = [
  # Core orchestration & LLMs
  "langgraph>=0.1.0",
  "anthropic>=0.32.0",
  "openai>=1.0.0",
  "google-generativeai>=0.3.0",

  # Data & storage
  "duckdb>=1.0.0",
  "pandas>=2.0.0",
  "polars>=0.20.0",
  "pyarrow>=15.0.0",

  # Market data & fundamentals
  "alpaca-py>=0.27.0",
  "nasdaq-data-link>=1.0.0",
  "requests>=2.31.0",

  # Validation & backtesting
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "scikit-learn>=1.3.0",

  # Utilities
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "structlog>=23.1.0",
  "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "black>=23.0.0",
  "ruff>=0.1.0",
  "mypy>=1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "agents", "graphs", "harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers -m 'not integration'"
markers = [
  "unit: unit tests",
  "integration: integration tests",
  "slow: slow tests",
]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
